services:
  mysql:
    image: mysql:8.0.32
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: sirius
      MYSQL_DATABASE: criti-pixel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psirius"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_db: